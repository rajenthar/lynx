name: Build

# Frontend deploys are Vercel's own job (its GitHub App builds+deploys on
# push independently of this workflow) — the frontend step here is a CI
# gate only (fails the check before merge), never a deploy.
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  packages: write   # needed only by the docker-build-push job, below

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # One reactor build from the repo root — builds shared modules
      # (lynx-common, lynx-money, lynx-security, lynx-idempotency,
      # lynx-events, lynx-telemetry) THEN every service, in the correct
      # dependency order, all into this job's own local .m2. No separate
      # artifact registry needed for Java dependencies — see
      # docs/html/deployment/cloud-deployment.html for why.
      #
      # Integration tests use Testcontainers (real ephemeral Postgres per
      # test class) — ubuntu-latest runners have Docker preinstalled, so
      # this needs no external database at all.
      - name: Build & test every module (shared libs + all services)
        run: mvn -B install

      # Each service's target/*.jar is what docker-build-push needs next —
      # jobs run in separate, isolated workspaces, so this is how the jar
      # actually gets from THIS job to that one.
      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*.jar
          retention-days: 1

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/lynx-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/lynx-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `next build` already runs its own full TypeScript check internally
      # — a separate `tsc --noEmit` BEFORE this would fail on a fresh
      # checkout anyway: Next.js-generated global types (e.g. LayoutProps)
      # only exist once `.next/types/` has been generated by a build, which
      # a clean CI checkout never has yet.
      - run: npm run build

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - ledger-service
          - fx-rate-service
          - saga-orchestrator
          - account-service
          - transaction-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Download this service's built jar
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services  # lands as services/<service>/target/<service>-*.jar, matching the upload's own path shape

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lynx-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lynx-${{ matrix.service }}:latest
