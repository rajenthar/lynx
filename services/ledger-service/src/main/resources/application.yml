server:
  port: 8081

spring:
  application:
    name: ledger-service
  datasource:
    # Port 5433, not Postgres's default 5432: this machine also runs a
    # native (non-Docker) Postgres bound to 5432, which would otherwise
    # silently receive this connection instead of infra's lynx-postgres
    # container. infra/docker-compose.local.yml's postgres service is
    # started with POSTGRES_PORT=5433 to avoid that collision.
    # ${DB_URL:default} — production points this at a POOLED connection
    # (e.g. Neon's pgbouncer endpoint); see configs/neon/README.md for why
    # this must NOT be the same endpoint Flyway uses below.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lynx}
    username: ${DB_USERNAME:lynx}
    password: ${DB_PASSWORD:lynx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # A SEPARATE, direct (non-pooled) connection for Flyway specifically —
    # its own migration lock is a PostgreSQL advisory lock, which needs
    # session-level semantics a transaction-pooled connection doesn't
    # provide. Falls back to DB_URL itself if DB_FLYWAY_URL isn't set.
    url: ${DB_FLYWAY_URL:${spring.datasource.url}}
    user: ${DB_USERNAME:lynx}
    password: ${DB_PASSWORD:lynx}
    # Every service shares ONE Postgres database but Flyway's default
    # history table name is the same for everyone — without a per-service
    # name here, this service's "version 1" collides with every OTHER
    # service's own "version 1" (different SQL, same version number).
    table: flyway_schema_history_ledger
    # This schema is shared by every service and may already have OTHER
    # services' tables in it when this one migrates for the first time.
    baseline-on-migrate: true
    # Baseline BELOW version 1, not at it — otherwise V1 itself would be
    # skipped as "already applied" and this service's own tables would
    # never actually get created.
    baseline-version: "0"

management:
  tracing:
    sampling:
      probability: 1.0   # trace every request locally; production would sample down
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health, metrics

# %X{traceId}/%X{spanId} are populated automatically by micrometer-tracing-bridge-otel
# per request (Spring Boot's documented MDC log-correlation behavior) — no
# ledger-service code sets them; %X{sagaId}/%X{correlationId} ARE Lynx's own
# (SagaMdc/CorrelationIdFilter). All four appear on every log line.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{sagaId:-},%X{correlationId:-}]"

lynx:
  security:
    # auth-service now exists and answers exactly this URL
    # when run locally on port 8080. Tests still wire an in-memory JWKS
    # directly rather than hitting it over HTTP (see JwtVerifierTest's pattern).
    jwks-url: http://localhost:8080/auth/.well-known/jwks.json
    issuer: https://auth.lynx
    audience: lynx-api
  redis:
    # infra/docker-compose.local.yml's lynx-redis container, default port,
    # no auth, no TLS. Production (Upstash) needs all four overridden —
    # see configs/upstash/README.md.
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
