server:
  port: 8085

spring:
  application:
    name: transaction-service

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      headers:
        Authorization: ${OTEL_EXPORTER_OTLP_AUTH_HEADER:}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        headers:
          Authorization: ${OTEL_EXPORTER_OTLP_AUTH_HEADER:}
  endpoints:
    web:
      exposure:
        include: health, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{sagaId:-},%X{correlationId:-}]"

lynx:
  security:
    jwks-url: ${AUTH_SERVICE_URL:http://localhost:8080}/auth/.well-known/jwks.json
    issuer: https://auth.lynx
    audience: lynx-api
  # ADR-007: this service's OWN identity when calling saga-orchestrator/
  # account-service. Seeded into auth-service's service_clients table at
  # ITS startup (ServiceClientSeeder).
  service-token:
    token-endpoint: ${AUTH_SERVICE_URL:http://localhost:8080}/auth/token
    client-id: transaction-service
    client-secret: ${LYNX_SERVICE_CLIENT_SECRET:placeholder-not-a-real-secret}
  clients:
    saga-orchestrator:
      base-url: ${SAGA_ORCHESTRATOR_URL:http://localhost:8083}
    account-service:
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8084}
