server:
  port: 8084

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5433/lynx
    username: ${DB_USERNAME:lynx}
    password: ${DB_PASSWORD:lynx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Every service shares ONE Postgres database but Flyway's default
    # history table name is the same for everyone — without a per-service
    # name here, this service's "version 1" collides with every OTHER
    # service's own "version 1" (different SQL, same version number).
    table: flyway_schema_history_account
    # This schema is shared by every service and may already have OTHER
    # services' tables in it when this one migrates for the first time.
    baseline-on-migrate: true
    # Baseline BELOW version 1, not at it — otherwise V1 itself would be
    # skipped as "already applied" and this service's own tables would
    # never actually get created.
    baseline-version: "0"
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: account-service
      # Rebuild the WHOLE projection from history on a fresh instance
      # (ADR-005: this table is a derived, disposable view) — not "only new
      # events from now on", which is what a normal consumer usually wants.
      auto-offset-reset: earliest
      # Manual, per-record commit instead (see listener.ack-mode below) —
      # Kafka's own periodic auto-commit would advance the offset on a
      # timer regardless of whether OutboxEventConsumer actually finished
      # processing, which could commit past a record that failed.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit each record's offset only after
      # OutboxEventConsumer.onMessage calls ack.acknowledge() itself, which
      # only happens after EventProjector.apply() returns successfully.
      ack-mode: manual_immediate
    producer:
      # Only ever used for BeansConfig's DeadLetterPublishingRecoverer
      # — this service publishes nothing else.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

lynx:
  security:
    jwks-url: http://localhost:8080/auth/.well-known/jwks.json
    issuer: https://auth.lynx
    audience: lynx-api
  # ADR-007: this service's OWN identity when calling ledger-service's
  # deposit endpoint. Seeded into auth-service's service_clients table at
  # ITS startup — see auth-service's ServiceClientSeeder.
  service-token:
    token-endpoint: http://localhost:8080/auth/token
    client-id: account-service
    client-secret: ${LYNX_SERVICE_CLIENT_SECRET:placeholder-not-a-real-secret}
  clients:
    ledger-service:
      base-url: http://localhost:8081
  kafka:
    # The topic Debezium's connector produces to (topic.prefix=lynx,
    # schema=public, table=outbox) — see infra/debezium/ledger-outbox-connector.json.
    outbox-topic: lynx.public.outbox
