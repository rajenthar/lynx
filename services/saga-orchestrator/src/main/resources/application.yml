server:
  port: 8083

spring:
  application:
    name: saga-orchestrator
  datasource:
    # Same shared local Postgres as every other service (port 5433, avoiding
    # a collision with a native, non-Docker Postgres on this machine bound
    # to 5432 — see ledger-service's own application.yml for the full note).
    url: jdbc:postgresql://localhost:5433/lynx
    username: ${DB_USERNAME:lynx}
    password: ${DB_PASSWORD:lynx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Every service shares ONE Postgres database but Flyway's default
    # history table name is the same for everyone — without a per-service
    # name here, this service's "version 1" collides with every OTHER
    # service's own "version 1" (different SQL, same version number).
    table: flyway_schema_history_saga
    # This schema is shared by every service and may already have OTHER
    # services' tables in it when this one migrates for the first time.
    baseline-on-migrate: true
    # Baseline BELOW version 1, not at it — otherwise V1 itself would be
    # skipped as "already applied" and this service's own tables would
    # never actually get created.
    baseline-version: "0"

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{sagaId:-},%X{correlationId:-}]"

lynx:
  security:
    # auth-service now exists and answers exactly this URL
    # when run locally on port 8080. Tests still wire an in-memory JWKS
    # directly rather than hitting it over HTTP.
    jwks-url: http://localhost:8080/auth/.well-known/jwks.json
    issuer: https://auth.lynx
    audience: lynx-api
  # ADR-007: this service's OWN identity when calling ledger-service/
  # fx-rate-service. This exact client-id/client-secret pair is seeded into
  # auth-service's service_clients table at ITS startup (ServiceClientSeeder)
  # — running both services locally, this actually
  # works end to end now. Tests still mock ServiceTokenProvider's HttpClient
  # directly (see ServiceTokenProviderTest's own pattern), never hit this
  # URL for real.
  service-token:
    token-endpoint: http://localhost:8080/auth/token
    client-id: saga-orchestrator
    client-secret: ${LYNX_SERVICE_CLIENT_SECRET:placeholder-not-a-real-secret}
  clients:
    ledger-service:
      base-url: http://localhost:8081
    fx-rate-service:
      base-url: http://localhost:8082
