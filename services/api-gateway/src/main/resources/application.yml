server:
  port: 8086

spring:
  application:
    name: api-gateway
  data:
    redis:
      # Same Redis instance lynx-idempotency's own RedisIdempotencyCache
      # already uses elsewhere in this project — no new infrastructure,
      # just the reactive driver instead of the blocking Jedis one.
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Applied to every route below, once, rather than repeated per
      # route — the same token-bucket limits for every
      # public endpoint today; a future route needing different limits
      # can still override this with its own per-route `filters` entry.
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            # SpEL bean reference — resolves to RateLimitConfig's
            # rateLimitKeyResolver bean (per-user, falling back to per-IP).
            key-resolver: "#{@rateLimitKeyResolver}"
      routes:
        # Only register/login are truly public here — /auth/token
        # (the Client Credentials grant) and /auth/.well-known/jwks.json
        # are both called service-to-service, directly against
        # auth-service's own port, never through this gateway.
        - id: auth-service-register
          uri: http://localhost:8080
          predicates:
            - Path=/auth/register
            - Method=POST
        - id: auth-service-login
          uri: http://localhost:8080
          predicates:
            - Path=/auth/login
            - Method=POST

        # /v1/accounts/** only — account-service's internal
        # /internal/accounts/resolve-transfer lives under a completely
        # different path prefix, so it's never matched by this predicate
        # at all; no explicit exclusion rule needed.
        - id: account-service
          uri: http://localhost:8084
          predicates:
            - Path=/v1/accounts/**

        # The whole service — transaction-service has no internal-only
        # surface at all.
        - id: transaction-service
          uri: http://localhost:8085
          predicates:
            - Path=/v1/transfers/**

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health, metrics, gateway

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
